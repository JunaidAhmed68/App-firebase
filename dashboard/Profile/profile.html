<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./profile.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
</head>
<body>

<!-- Sidebar (Shown on Large Screens) -->
<div class="sidebar d-none d-lg-block">
  <h2 class="text-center" style="font-family: 'Dancing Script', cursive; color: #A2CFFE;">Dashboard</h2>
  <ul class="nav flex-column">
    <a class="nav-link" href="../home/home.html">
      <i class="fas fa-home"></i> Home
    </a>
    <a class="nav-link" href="#" id="create-post">
      <i class="fas fa-pencil-alt"></i> Create Post
    </a>
    <a class="nav-link" href="#" id="friend-requests">
      <i class="fas fa-user-friends"></i> Friend Requests
    </a>
    <a class="nav-link" href="#" id="notifications">
      <i class="fas fa-bell"></i> Notifications
    </a>
    <a class="nav-link active" href="#" id="profile">
      <i class="fas fa-user"></i> Profile
    </a>
    <a class="nav-link logout-btn" href="#" id="logout-btn">
      <i class="fas fa-sign-out-alt"></i> Logout
    </a>
  </ul>
</div>


<!-- Main Content -->
<div class="main-content"">
  <div class="container mt-4">
    <h2 class="text-center" style="font-family: 'Dancing Script', cursive; color: #010101; ">My Profile</h2>
    
    <!-- Profile Information -->
    
   <!-- Profile Information -->
   <div class="row" style="background-color: black;padding-top:30px">
    <div class="col-md-4 text-center" style="display: flex; justify-content: space-between; align-items: center; flex-direction: row; width: 800px; min-width: 300px;color: white;">
      <div>
        <img src="https://t4.ftcdn.net/jpg/02/15/84/43/360_F_215844325_ttX9YiIIyeaR7Ne6EaLLjMAmy4GvPC69.jpg" alt="Profile Picture" class="img-fluid rounded-circle" id="Profile_Picture" style="width: 100px; height: 100px;">
        <h4 id="profile-name"  style="margin-top: 10px; ">No user name</h4>
        <p id="profile-email" style="color: gray;" >xyz@gmail.com</p>
      </div>
     <div>
      <h4 id="profile-posts">Posts: <span id="total-posts">0</span> </h4>
    </div>
     <div>
       <h4 id="profile-friends">Friends: 0</h4>
     </div>
    </div>
  </div>

    <!-- Posts Section -->
    <div class="mt-4" style="background-color: #A2CFFE; padding: 20px;">
      <h4>Your Posts</h4>
      
         <!-- Message Box / Modal -->
         <div id="msg-modal" class="msg-modal">
          <span id="msg-text"></span>
        </div>


    <!-- Modal Structure -->
    <div id="myModal" class="modal" style="display: none; align-items: center; justify-content: center;">
      <div class="modal-content">
        <span id="cancelBtn" class="close-btn">&times;</span>
        <h2>Edit Post</h2>
        <label for="editPostText">Edit your post text:</label>
        <textarea id="editPostText" class="form-control" rows="4" placeholder="Edit your post here..."></textarea>
        <button id="savePostBtn" class="btn btn-primary mt-3" >Save</button>
      </div>
    </div>




      <div id="posts-container" class="border p-3" style="min-height: 200px;">
        <!-- Posts will be rendered here -->
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../changeForm.js"></script>
<script type="module" src="./profile.js"></script>

</body>
</html>
