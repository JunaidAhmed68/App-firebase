<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./chat.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  
</head>
<body>

<!-- Hamburger Icon (Visible on All Screens) -->
<div class="hamburger-menu" id="hamburger-icon">
  <i class="fas fa-bars"></i>
</div>
<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2 class="text-center" style="font-family: 'Dancing Script', cursive; color: #A2CFFE;">My App</h2>
  <ul class="nav flex-column">
    <a class="nav-link" href="../home/home.html">
      <i class="fas fa-home"></i> Home
    </a>
    <a class="nav-link" href="#" id="create-post">
      <i class="fas fa-pencil-alt"></i> Create Post
    </a>
    <a class="nav-link" href="#" id="friend-requests">
      <i class="fas fa-user-friends"></i> Friend Requests
    </a>
    <a class="nav-link active" href="#" id="chat">
      <i class="fas fa-comments"></i> Chat
    </a>
    <a class="nav-link" href="#" id="notifications">
      <i class="fas fa-bell"></i> Notifications
    </a>
    <a class="nav-link" href="#" id="profile">
      <i class="fas fa-user"></i> Profile
    </a>
    <a class="nav-link logout-btn" href="#" id="logout-btn">
      <i class="fas fa-sign-out-alt"></i> Logout
    </a>
  </ul>
</div>



<!-- Main Content -->
<div class="main-content" style="width:100%">
  <div class="container mt-4 main-inn">

    




    <!-- Confirmation Modal for Logout -->
<div id="logout-confirmation-modal" class="modal" style="display: none;">
  <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;" >
        <h2></h2>
        <span class="close-logout" id="close-logout-modal" style="color:red; font-size: larger; " >X</span>
      </div>
      <h2>Confirm Logout</h2>
      <p>Are you sure you want to log out?</p>
      <button id="confirm-logout-action">Yes, Logout</button>
      <button id="cancel-logout-action">Cancel</button>
  </div>
</div>

         <!-- Message Box / Modal -->
         <div id="msg-modal" class="msg-modal">
          <span id="msg-text"></span>
        </div>


        <div class="chat-container" style="margin-top:20px; max-width:900px;">
          <div class="left-panel" style="width: 30%;">
              <h3>Friends</h3>
              <div id="friendsListContainer"></div>
          </div>
          <div id="chatContainer" style="width: 70%;">
            <div class="chat-header">
              <img id="chatFriendPhoto" src="" alt="Friend Photo">
              <div class="name" id="chatFriendName">Chat</div>
              <button class="close-btn" id="closeChatBtn">&times;</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
              <input type="text" id="messageInput" placeholder="Type your message...">
              <button id="sendMessageBtn">Send</button>
            </div>
          </div>
      </div>
      
  </div>
</div>

<!-- Bootstrap JS -->
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../changeForm.js"></script>
<script type="module" src="./chat.js"></script>

</body>
</html>
