<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleName" >This User</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./OpenProfile.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <link id="favicon" style="border-radius: 50%;" rel="icon" type="image/png" href="https://t4.ftcdn.net/jpg/02/15/84/43/360_F_215844325_ttX9YiIIyeaR7Ne6EaLLjMAmy4GvPC69.jpg">
</head>
<body>



<!-- Main Content -->
<div class="main-content" width="100%">
  <div class="container main-inn">

    <!-- Profile Information -->
    
    <div class="container-fluid text-white py-4 profInfoDiv position-relative">
      <div class="row justify-content-start text-center">
        <div class="col-lg-6 col-md-8 col-sm-10 d-flex flex-wrap align-items-start justify-content-around profInfoDiv2">
          <div class="text-center mb-3">
            <img src="https://t4.ftcdn.net/jpg/02/15/84/43/360_F_215844325_ttX9YiIIyeaR7Ne6EaLLjMAmy4GvPC69.jpg"
                 alt="Profile Picture"
                 class="img-fluid rounded-circle"
                 id="Profile_Picture">
            <h4 id="profile-name" class="mt-2">No user name</h4>
            <p id="profile-email" style="font-size: smaller; color:#adadad; margin-bottom:5px;">xyz@gmail.com</p>
            <p id="bio-display"></p>
          </div>
    
          <div class="text-center mx-2">
            <h4 id="profile-posts">
              <a href="#my-Allposts" class="sp-the-btn" style="text-decoration: none;color: inherit;">Posts</a>
              <h5 id="total-posts" class="sp-the-btn">0</h5>
            </h4>
          </div>
    
          <div class="text-center mx-2">
            <h4 id="profile-friends" class="sp-the-btn">Friends<h5 id="total-frnds" class="sp-the-btn">0</h5></h4>
          </div>
        </div>
      </div>
      <p id="remove-frnd-btn"styl="display:none;" >Remove friend</p>
      <p id="send-req-btn" style="display:none;" >Send friend request</p>
      <p id="send-req-btn-pending" style="display:none;" >Friend request pending</p>
      <p id="send-req-text" style="display:none;" >wants to be your friend</p>
      <div id="accept-remove-req-btns" style="display:none;" >
        <p id="accept-req-btn"  >Accept</p>
        <p id="remove-req-btn"  >Reject</p>
     </div>
      
    </div>





    

      <!-- remove friend Confirmation Modal -->
      <div id="removeFriendModal" class="modal" style="display: none;">
        <div class="modal-content cen-div">
          <span class="close-btn" id="closeRemoveFriendModal" style="color:red; ">&times;</span>
          <h2>Remove friend</h2>
          <p id="removeFriendCnfmText">Are you sure you want to remove this friend?</p>
          <div class="modal-buttons">
            <button id="cancelRemoveFriendBtn" class="btn btn-secondary" >Cancel</button>
            <button id="confirmRemoveFriendBtn" class="btn btn-danger">Remove</button>
          </div>
        </div>
      </div>

   <!-- Posts Section -->
   <div class="post-sec" id="my-Allposts">
    <h4>Their posts</h4>
    <div id="posts-container" class="border" style="min-height: 200px;">
      <!-- Posts will be rendered here -->
    </div>
  </div>

    <!-- Message Box / Modal -->
    <div id="msg-modal" class="msg-modal">
      <span id="msg-text"></span>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../changeForm.js"></script>
<script type="module" src="./OpenProfile.js"></script>

</body>
</html>
