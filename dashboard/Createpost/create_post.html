<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a post</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./create_post.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
</head>
<body>

<!-- Sidebar (Shown on Large Screens) -->
<div class="sidebar d-none d-lg-block">
  <h2 class="text-center" style="font-family: 'Dancing Script', cursive; color: #A2CFFE;">My App</h2>
  <ul class="nav flex-column">
    <a class="nav-link" href="../home/home.html">
      <i class="fas fa-home"></i> Home
    </a>
    <a class="nav-link active" href="#" id="create-post">
      <i class="fas fa-pencil-alt"></i> Create Post
    </a>
    <a class="nav-link" href="#" id="friend-requests">
      <i class="fas fa-user-friends"></i> Friend Requests
    </a>
    <a class="nav-link" href="#" id="chat">
      <i class="fas fa-comments"></i> Chat
    </a>
    <a class="nav-link" href="#" id="notifications">
      <i class="fas fa-bell"></i> Notifications
    </a>
    <a class="nav-link" href="#" id="profile">
      <i class="fas fa-user"></i> Profile
    </a>
    <a class="nav-link logout-btn" href="#" id="logout-btn">
      <i class="fas fa-sign-out-alt"></i> Logout
    </a>
  </ul>
</div>



<!-- -- Main Content -->
<div class="main-content">
    <!-- Message Box / Modal -->
    <div id="msg-modal" class="msg-modal">
      <span id="msg-text"></span>
    </div>

    <div class="container mt-5">
      <h2>Create Post</h2>
      <form id="createPostForm">
          <div class="mb-3">
              <label for="postText" class="form-label">Post Text</label>
              <textarea class="form-control" id="postText" rows="3" ></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit Post</button>
      </form>
    </div>
 
   <!-- Confirmation Modal for Logout -->
<div id="logout-confirmation-modal" class="modal" style="display: none;">
  <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;" >
        <h2></h2>
        <span class="close-logout" id="close-logout-modal" style="color:red; font-size: larger; " >X</span>
      </div>
      <h2>Confirm Logout</h2>
      <p>Are you sure you want to log out?</p>
      <button id="confirm-logout-action">Yes, Logout</button>
      <button id="cancel-logout-action">Cancel</button>
  </div>
</div>



    <!-- Container for Posts -->
    <div class="container mt-4" id="all-posts-home" style="background-color: #A2CFFE; padding: 20px;display:none;">
      <h2>New post created</h2>
      <div id="post_created" class="row">
        <!-- Post cards will be added dynamically here -->
      </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../changeForm.js" ></script>
<script type="module" src="./create_post.js"></script>

</body>
</html>
